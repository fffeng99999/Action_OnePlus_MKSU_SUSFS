name: Build OnePlus_SukiSU Ultra ACE6T
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          sudo apt install -y python3 git curl

      - name: Install repo tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b refs/heads/oneplus/sm8845 -m oneplus_ace_6t.xml --depth=1
          # 移除 CodeLinaro 上分支已失效的非必要仓库（asuite/tradefed 仅用于 IDE 和测试，内核编译不需要）
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/remove_unused.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remove-project name="kernel_platform/prebuilts/asuite" />
            <remove-project name="kernel_platform/tools/tradefederation/prebuilts" />
          </manifest>
          EOF
          repo sync
          if [  -e kernel_platform/common/BUILD.bazel ]; then
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/common/BUILD.bazel
          fi
          if [  -e kernel_platform/msm-kernel/BUILD.bazel ]; then
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/msm-kernel/BUILD.bazel
          fi
          if [  -e kernel_platform/soc-repo/BUILD.bazel ]; then
          sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' kernel_platform/soc-repo/BUILD.bazel
          fi
          rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/soc-repo/android/abi_gki_protected_exports_* || echo "No protected exports!"

      # 删除 -dirty 后缀
      - name: Force remove -dirty suffix
        run: |
          cd kernel_workspace/kernel_platform
          sed -i 's/ -dirty//g' common/scripts/setlocalversion
          # 兼容 external/dtc 和 external/qcom-dtc 两种路径
          [ -f external/dtc/scripts/setlocalversion ] && sed -i 's/ -dirty//g' external/dtc/scripts/setlocalversion
          [ -f external/qcom-dtc/scripts/setlocalversion ] && sed -i 's/ -dirty//g' external/qcom-dtc/scripts/setlocalversion
          # sm8845 manifest 把 SoC 内核放在 soc-repo，而非 msm-kernel
          find . -maxdepth 3 -name setlocalversion ! -path "./common/*" ! -path "./external/*" -exec sed -i 's/ -dirty//g' {} \;
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' common/scripts/setlocalversion
          git add -A
          git commit -m "Force remove -dirty suffix from kernel version"

      # 添加 SukiSU Ultra
      - name: Add KernelSU-SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          cd ./KernelSU
          KSU_VERSION=$(expr $(/usr/bin/git rev-list --count main) "+" 10606)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          export KSU_VERSION=$KSU_VERSION
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile

      - name: Apply Patches SukiSU Ultra
        run: |
          cd kernel_workspace
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android16-6.12
          git clone https://github.com/fffeng99999/SukiSU_patch.git
          cd kernel_platform
          echo "正在给内核打susfs补丁"
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch ./common/
          cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/

          echo "正在给内核打zram补丁"
          cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux
          cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib
          cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto
          cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/

          cd ./common
          patch -p1 < 50_add_susfs_in_gki-android16-6.12.patch || true
          echo "完成"

      - name: Apply Hide Stuff Patches
        run: |
          cd kernel_workspace/kernel_platform/common
          cp ../../SukiSU_patch/69_hide_stuff.patch ./
          echo "正在打隐藏应用补丁"
          patch -p1 -F 3 < 69_hide_stuff.patch

      - name: Apply LZ4KD
        run: |
          cd kernel_workspace/kernel_platform/common
          # SukiSU_patch 仓库当前没有 6.12 版本的 lz4kd 补丁，跳过此步骤
          if [ -f ../../SukiSU_patch/other/zram/zram_patch/6.12/lz4kd.patch ]; then
            cp ../../SukiSU_patch/other/zram/zram_patch/6.12/lz4kd.patch ./
            echo "正在打lz4kd补丁"
            patch -p1 -F 3 < lz4kd.patch || true
            echo '完成LZ4KD补丁'
          else
            echo "未找到 6.12 版本的 lz4kd.patch，跳过 LZ4KD 补丁（ZRAM 将使用默认算法）"
          fi

      # 配置信息
      - name: Add Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform
          CONFIG_FILE=./common/arch/arm64/configs/gki_defconfig

          # SukiSU Ultra config
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          echo "CONFIG_KPM=y" >> "$CONFIG_FILE"

          # SUSFS config
          echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"

          # Remove check_defconfig
          [ -f ./common/build.config.gki ] && sed -i 's/check_defconfig//' ./common/build.config.gki || echo "build.config.gki 不存在，跳过 check_defconfig 移除"

          # LZ4KD配置 (KERNEL_VERSION=6.12, ANDROID_VERSION=android16)
          echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
          sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"

          if [  -e ./common/modules.bzl ]; then
            sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./common/modules.bzl"
          fi

          if [  -e ./msm-kernel/modules.bzl ]; then
            sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./msm-kernel/modules.bzl"
            echo "CONFIG_ZSMALLOC=y" >> "msm-kernel/arch/arm64/configs/canoe-GKI.config"
            echo "CONFIG_ZRAM=y" >> "msm-kernel/arch/arm64/configs/canoe-GKI.config"
          fi

          # sm8845 manifest 使用 soc-repo 作为 SoC 内核路径
          if [  -e ./soc-repo/modules.bzl ]; then
            sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "./soc-repo/modules.bzl"
            echo "CONFIG_ZSMALLOC=y" >> "soc-repo/arch/arm64/configs/canoe-GKI.config"
            echo "CONFIG_ZRAM=y" >> "soc-repo/arch/arm64/configs/canoe-GKI.config"
          fi

          echo "CONFIG_MODULE_SIG_FORCE=n" >> "$CONFIG_FILE"

          if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
            echo "CONFIG_CRYPTO_LZ4HC=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_LZ4K=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_842=y" >> "$CONFIG_FILE"
            echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
          fi

      # sm8845 走 oplus_build_kernel.sh 编译路径
      - name: Build kernel
        run: |
          cd kernel_workspace
          LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 ./kernel_platform/oplus/build/oplus_build_kernel.sh canoe gki
          # 验证构建产物是否存在（oplus_build_kernel.sh 可能不返回非零退出码）
          echo "=== 验证构建产物 ==="
          if ! find kernel_platform/out -name "Image" -type f | grep -q "Image"; then
            echo "错误：构建产物中未找到 Image 文件"
            echo "=== out/ 目录结构 ==="
            find kernel_platform/out -maxdepth 4 -type d | head -50
            echo "=== 查找所有 Image 和 .img 文件 ==="
            find kernel_platform/out -type f \( -name "Image" -o -name "*.img" \) 2>&1 | head -30
            echo "=== 查找可能的错误日志 ==="
            find kernel_platform/out -name "*.log" -type f 2>&1 | head -10
            exit 1
          fi
          echo "构建产物验证通过"

      - name: Make AnyKernel3
        run: |
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git

          # 诊断：列出 out/ 实际目录结构
          echo "=== out/ 目录结构 ==="
          if [ -d kernel_workspace/kernel_platform/out ]; then
            find kernel_workspace/kernel_platform/out -maxdepth 3 -type d 2>&1 | head -50
          else
            echo "out/ 目录不存在！构建可能未生成输出"
            echo "=== kernel_platform/ 顶层结构 ==="
            ls -la kernel_workspace/kernel_platform/ 2>&1
          fi

          # 诊断：在整个 kernel_workspace 中查找 Image
          echo "=== 搜索所有 Image 文件 ==="
          find kernel_workspace -name "Image" -type f 2>&1 | head -20

          dir1="kernel_workspace/kernel_platform/out/msm-kernel-canoe-gki/dist/"
          dir2="kernel_workspace/kernel_platform/bazel-out/k8-fastbuild/bin/msm-kernel/canoe_gki_kbuild_mixed_tree/"
          dir3="kernel_workspace/kernel_platform/out/msm-canoe-canoe-gki/dist/"
          dir4="kernel_workspace/kernel_platform/out/msm-kernel-canoe-gki/gki_kernel/common/arch/arm64/boot/"
          dir5="kernel_workspace/kernel_platform/out/msm-canoe-canoe-gki/gki_kernel/common/arch/arm64/boot/"
          # sm8845 manifest 使用 soc-repo，构建输出可能用 soc-repo 命名
          dir6="kernel_workspace/kernel_platform/out/soc-repo-canoe-gki/dist/"
          dir7="kernel_workspace/kernel_platform/out/soc-repo-canoe-gki/gki_kernel/common/arch/arm64/boot/"
          target1="./AnyKernel3/"
          target2="./kernel_workspace/kernel"

          # 查找 Image 文件（先在候选目录中找，再用更宽的兜底搜索）
          image_path=""
          for d in "$dir1" "$dir2" "$dir3" "$dir4" "$dir5" "$dir6" "$dir7"; do
            if [ -d "$d" ] && find "$d" -name "Image" -type f | grep -q "Image"; then
              image_path=$(find "$d" -name "Image" -type f | head -n 1)
              echo "在 $d 找到 Image: $image_path"
              break
            fi
          done

          # 兜底：在整个 kernel_workspace 中查找
          if [ -z "$image_path" ]; then
            echo "候选目录中未找到 Image，执行全局搜索..."
            image_path=$(find kernel_workspace -name "Image" -type f 2>/dev/null | head -n 1)
            if [ -n "$image_path" ]; then
              echo "全局搜索找到 Image: $image_path"
            fi
          fi

          # 拷贝 Image
          if [ -n "$image_path" ] && [ -f "$image_path" ]; then
            mkdir -p "$dir1"
            cp "$image_path" "$dir1"
            cp "$dir1"Image ./AnyKernel3/Image
            echo "已拷贝 Image 到 AnyKernel3/"
          else
            echo "未找到 Image 文件，构建可能失败"
            echo "=== 最后诊断：列出 out/ 下所有 .img 和 Image 文件 ==="
            find kernel_workspace/kernel_platform/out -type f \( -name "*.img" -o -name "Image" \) 2>&1 | head -30
            exit 1
          fi

          # sm8845 同代衍生 SoC，拷贝额外镜像
          # 在所有候选目录中查找额外镜像文件
          for file in dtbo.img system_dlkm.erofs.img vendor_dlkm.img vendor_boot.img; do
            target_name="$file"
            # 特殊处理 system_dlkm.erofs.img 的目标名
            if [ "$file" = "system_dlkm.erofs.img" ]; then
              target_name="system_dlkm.img"
            fi
            found_file=""
            # 在 Image 所在目录及其上级 dist 目录中查找
            search_dirs=("$dir1" "$dir3" "$dir6" "$dir7" "$(dirname "$image_path")")
            for d in "${search_dirs[@]}"; do
              if [ -f "$d$file" ]; then
                found_file="$d$file"
                break
              fi
            done
            # 全局兜底搜索
            if [ -z "$found_file" ]; then
              found_file=$(find kernel_workspace/kernel_platform/out -name "$file" -type f 2>/dev/null | head -n 1)
            fi
            if [ -n "$found_file" ]; then
              cp "$found_file" "./AnyKernel3/$target_name"
              echo "已拷贝 $file"
            else
              echo "$file 不存在，跳过复制"
            fi
          done

      - name: Apply patch_linux and replace Image
        run: |
          DIST_DIR="/home/runner/work/Action_OnePlus_MKSU_SUSFS/Action_OnePlus_MKSU_SUSFS/kernel_workspace/kernel_platform/out/msm-kernel-canoe-gki/dist"
          # sm8845 manifest 使用 soc-repo，构建输出目录可能不同
          if [ ! -d "$DIST_DIR" ]; then
            DIST_DIR=$(find /home/runner/work/Action_OnePlus_MKSU_SUSFS/Action_OnePlus_MKSU_SUSFS/kernel_workspace/kernel_platform/out -type d -name "dist" | head -n 1)
          fi
          # 如果还没有 dist 目录，用包含 Image 的目录
          if [ -z "$DIST_DIR" ] || [ ! -d "$DIST_DIR" ]; then
            DIST_DIR=$(find /home/runner/work/Action_OnePlus_MKSU_SUSFS/Action_OnePlus_MKSU_SUSFS/kernel_workspace -name "Image" -type f -exec dirname {} \; 2>/dev/null | head -n 1)
          fi
          if [ -z "$DIST_DIR" ] || [ ! -d "$DIST_DIR" ]; then
            echo "无法找到包含 Image 的目录"
            exit 1
          fi
          echo "使用 DIST_DIR: $DIST_DIR"
          cd "$DIST_DIR"
          ls -la Image

          curl -LSs "https://raw.githubusercontent.com/fffeng99999/SukiSU_patch/refs/heads/main/kpm/patch_linux" -o patch_linux
          chmod +x patch_linux
          ./patch_linux
          rm -f Image
          mv oImage Image
          cp Image $GITHUB_WORKSPACE/AnyKernel3/Image

      # 下载 SUSFS 模块（CI 构建）
      - name: Download Latest SUSFS Module from CI
        run: |
          LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)

          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No successful run found for branch v1.5.2+"
            exit 1
          fi

          ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | jq -r '.artifacts[0].archive_download_url')

          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs.zip "$ARTIFACT_URL"
          cp ksu_module_susfs.zip ./AnyKernel3/

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_oneplus_ace_6t_KPM_VFS_LZ4KD
          path: ./AnyKernel3/*
